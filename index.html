<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profile Finder</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b131e] text-white min-h-screen flex flex-col items-center py-12 px-4 font-sans">

 
  <header class="text-center mb-8 max-w-xl w-full">
    <h1 class="text-4xl font-extrabold tracking-wide mb-2">GitHub Profile Finder</h1>
    <p class="text-slate-400 text-sm">Search any GitHub user to see their profile and latest repositories.</p>
    
   
    <form id="search-form" class="mt-6 flex gap-3">
      <input 
        type="text" 
        id="username-input" 
        placeholder="Enter a GitHub username..." 
        class="flex-1 bg-[#151f2c] border border-slate-700/60 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition"
      />
      <button 
        type="submit" 
        class="bg-[#facc15] hover:bg-amber-400 text-black font-semibold px-6 py-3 rounded-xl transition duration-200"
      >
        Search
      </button>
    </form>

    
    <div class="flex items-center gap-2 mt-4 text-sm text-slate-400 justify-start">
      <span>Try:</span>
      <button onclick="fetchProfile('torvalds')" class="bg-[#152232] border border-slate-700/50 hover:border-amber-400 text-blue-400 text-xs px-3 py-1 rounded-full transition">torvalds</button>
      <button onclick="fetchProfile('gaearon')" class="bg-[#152232] border border-slate-700/50 hover:border-amber-400 text-blue-400 text-xs px-3 py-1 rounded-full transition">gaearon</button>
      <button onclick="fetchProfile('sindresorhus')" class="bg-[#152232] border border-slate-700/50 hover:border-amber-400 text-blue-400 text-xs px-3 py-1 rounded-full transition">sindresorhus</button>
    </div>
  </header>

  
  <main id="content" class="max-w-3xl w-full space-y-8">
    
    <div id="placeholder" class="bg-[#151f2c] border border-slate-700/40 rounded-2xl h-24 w-full"></div>
  </main>

  
  <script src="app.js"></script>
</body>
</html>
